data:
  interval: 1d
  history_period: 5y
  cache_dir: data/cache

features:
  lookback: 60          # candles fed to the model
  horizon: 5            # candles predicted ahead
  indicators: [returns, log_returns, rsi_14, atr_14, volume_z, sma_ratio_20]

model:
  name: lstm
  hidden_size: 64
  num_layers: 2
  dropout: 0.2
  lr: 0.001
  epochs: 40
  batch_size: 64
  mc_dropout_samples: 50   # for prediction intervals

retrain:
  rolling_window_days: 90
  drift_metric: mae_close
  drift_threshold_pct: 20   # retrain if MAE drifts >20% vs trailing baseline
  drift_lookback_candles: 10

valuation:
  forecast_years: 5
  default_wacc: 0.09
  default_terminal_growth: 0.025
  default_tax_rate: 0.21

storage:
  url: sqlite:///data/predictions.db
